version: '3.9'

services:
  # MySQL Database Service
  database:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-borrow_db}
      MYSQL_USER: ${DB_USER:-borrow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-borrow_pass}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - borrow-service
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  # Auth Service
  auth:
    image: chinnu9729/auth-service:latest
    container_name: auth-service
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-borrow_db}
      - DB_USER=${DB_USER:-borrow_user}
      - DB_PASSWORD=${DB_PASSWORD:-borrow_pass}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - borrow-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s

  # Books Service
  books:
    image: chinnu9729/books-service:latest
    container_name: books-service
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-borrow_db}
      - DB_USER=${DB_USER:-borrow_user}
      - DB_PASSWORD=${DB_PASSWORD:-borrow_pass}
      - AUTH_SERVICE_URL=http://auth:3001
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      database:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - borrow-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s

  # Borrowing Service
  borrowing:
    image: chinnu9729/borrowing-service:latest
    container_name: borrowing-service
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-borrow_db}
      - DB_USER=${DB_USER:-borrow_user}
      - DB_PASSWORD=${DB_PASSWORD:-borrow_pass}
      - AUTH_SERVICE_URL=http://auth:3001
      - BOOKS_SERVICE_URL=http://books:3002
      - PORT=3003
    ports:
      - "3003:3003"
    depends_on:
      database:
        condition: service_healthy
      auth:
        condition: service_healthy
      books:
        condition: service_healthy
    networks:
      - borrow-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s

  # Frontend Service
  frontend:
    image: chinnu9729/frontend-service:latest
    container_name: frontend-service
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost
      - AUTH_SERVICE_URL=http://auth:3001
      - BOOKS_SERVICE_URL=http://books:3002
      - BORROWING_SERVICE_URL=http://borrowing:3003
      - PORT=5000
    ports:
      - "5000:5000"
      - "80:5000"
    depends_on:
      - auth
      - books
      - borrowing
    networks:
      - borrow-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth
      - books
      - borrowing
    networks:
      - borrow-service
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  borrow-service:
    driver: overlay
    driver_opts:
      com.docker.network.driver.overlay.vxlanid: "4096"

volumes:
  db-data:
    driver: local
